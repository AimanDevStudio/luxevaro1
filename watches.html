<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watches | LUXEVARO</title>
  <meta name="description" content="Shop 25 luxury watches from Rolex, Audemars Piguet, Franck Muller, Patek Philippe and Cartier.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header is built by js/main.js -->
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">The Timepiece Collection</span>
        <h1>Luxury Watches</h1>
        <p>Twenty-five iconic watches from Rolex, Audemars Piguet, Franck Muller, Patek Philippe and Cartier.</p>
      </div>
    </section>

    <!-- Brand filter (built by main.js) -->
    <div class="filter-bar">
      <div class="container"><div class="chips" id="brand-chips" role="toolbar" aria-label="Filter by brand"></div></div>
    </div>

    <!-- Products grouped by brand (built by main.js from js/products.js) -->
    <div class="container" style="padding-bottom:5rem">
      <div id="catalogue" data-category="watch"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
